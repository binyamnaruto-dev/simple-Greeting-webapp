<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Greeting</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="Head-div">

        <div class="Header">
            <p>Welcome to the Greeting Web App.</p>
            <p>Make your Day!</p>
        </div>

            <div class="Img-header">
                <img src="../asset/Hello-removebg-preview.png" alt="">
            </div>
    </div>
    <div class="Body-div">
        <!-- user input part -->
        <div class="user-input-div">
            <input class="search-bar" type="text" placeholder="Enter your name and last name..." oninput="this.value = this.value.replace(/\d/g, '')">
        </div>
        <div class="user-input-div">
            <button class="search-btn">Click</button>
            <button class="search-btn2">Reset</button>
        </div>
        <!-- Result part -->
        <div class="Output-cont">
            <div class="Output-div">
                <p class="Greeting"></p>
                <p class="GreetingTime"></p>
            </div>
        </div>

    </div>

    <script src="../js/script.js"></script>
</body>
</html>
